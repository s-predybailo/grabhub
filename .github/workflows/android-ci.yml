name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared unit tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon
        env:
          THINGIVERSE_ACCESS_TOKEN: ${{ secrets.THINGIVERSE_ACCESS_TOKEN }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grabhub-${{ github.sha }}-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
